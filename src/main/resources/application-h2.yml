# Profile H2 - Pour tester l'application sans MySQL
# Lancer avec: java -jar doctor-doc.war --spring.profiles.active=h2
# Ou dans application.yml: spring.profiles.active=h2

spring:
  datasource:
    url: jdbc:h2:mem:doctordoc;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

logging:
  level:
    org.hibernate.SQL: DEBUG
