<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{selectkonto.title})}">
    <title>Select Account</title>
</head>
<body class="d-flex flex-column min-vh-100">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 th:text="#{selectkonto.title}">Select Account</h5>
                </div>
                <div class="card-body">

                    <p th:text="#{selectkonto.message}">You have access to multiple accounts. Please select one:</p>

                    <div class="list-group">
                        <form th:each="k : ${kontos}" th:action="@{/selectkonto}" method="post" class="d-inline">
                            <input type="hidden" name="kontoId" th:value="${k.id}">
                            <button type="submit" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="mb-1" th:text="${k.bibliotheksname}">Library Name</h6>
                                    <small class="text-muted" th:text="${k.ort}">City</small>
                                </div>
                                <span class="badge bg-primary rounded-pill" th:if="${k.isil}" th:text="${k.isil}">ISIL</span>
                            </button>
                        </form>
                    </div>

                </div>
                <div class="card-footer">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-secondary" th:text="#{menu.logout}">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
