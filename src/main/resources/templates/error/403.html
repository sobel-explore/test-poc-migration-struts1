<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}">
    <title>Access Denied</title>
</head>
<body class="d-flex flex-column min-vh-100">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
            <h1 class="display-1 text-danger">403</h1>
            <h2 th:text="#{error.accessdenied.title}">Access Denied</h2>
            <p class="lead" th:text="#{error.accessdenied.message}">
                You don't have permission to access this resource.
            </p>
            <a th:href="@{/uebersicht}" class="btn btn-primary" th:text="#{button.back}">Back to Overview</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
